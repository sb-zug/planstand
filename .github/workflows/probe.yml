name: Quellen testen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe.py
      - run: |
          git config user.name "planstand bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/probe_result.json
          git diff --cached --quiet || git commit -m "Quellen-Test $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
